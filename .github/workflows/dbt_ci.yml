name: dbt Slim CI

on:
  pull_request:
    paths:
      - 'dbt/**'

jobs:
  dbt-slim-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install dbt-core dbt-bigquery

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Write GCP credentials for dbt
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-key.json

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          olist_analytics:
            target: ci
            outputs:
              prod:
                type: bigquery
                method: service-account
                project: vital-valor-503422-i8
                dataset: staging
                keyfile: /tmp/gcp-key.json
                threads: 4
                location: us-central1

              ci:
                type: bigquery
                method: service-account
                project: vital-valor-503422-i8
                dataset: ci_pr
                keyfile: /tmp/gcp-key.json
                threads: 4
                location: us-central1
          EOF

      - name: Install dbt packages
        run: dbt deps

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download previous manifest
        run: |
          mkdir -p state
          gcloud storage cp gs://vital-valor-503422-i8-raw-data/dbt-state/manifest.json state/manifest.json

      - name: Run Slim CI
        run: dbt build --select state:modified+ --state ./state --defer --favor-state

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"❌ Slim CI a échoué sur la PR '"${{ github.event.pull_request.html_url }}"'"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}