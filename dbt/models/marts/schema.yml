version: 2

models:
  - name: dim_customer
    description: "One row per unique customer. Deduplicated from raw customer records, since Olist creates a new customer_id for every order."
    columns:
      - name: customer_key
        description: "Surrogate key generated from customer_unique_id. Used to join this dimension to fct_order_items."
        tests: [unique, not_null]
      - name: customer_unique_id
        description: "Stable identifier for a real customer, unlike customer_id which changes on every order."
        tests: [unique, not_null]
      - name: customer_city
        description: "City where the customer is located, based on their most recent order."
      - name: customer_state
        description: "Brazilian state where the customer is located (two-letter code)."

  - name: dim_seller
    description: "One row per seller registered on the platform."
    columns:
      - name: seller_key
        description: "Surrogate key generated from seller_id. Used to join this dimension to fct_order_items."
        tests: [unique, not_null]
      - name: seller_id
        description: "Unique identifier for a seller."
        tests: [unique, not_null]
      - name: seller_city
        description: "City where the seller is located."
      - name: seller_state
        description: "Brazilian state where the seller is located (two-letter code)."

  - name: dim_product
    description: "One row per product, including its category translated to English."
    columns:
      - name: product_key
        description: "Surrogate key generated from product_id. Used to join this dimension to fct_order_items."
        tests: [unique, not_null]
      - name: product_id
        description: "Unique identifier for a product."
        tests: [unique, not_null]
      - name: product_category_name_english
        description: "Product category name, translated from Portuguese to English."

  - name: dim_payment_type
    description: "List of distinct payment types used on the platform (credit card, boleto, voucher, etc.)."
    columns:
      - name: payment_type_key
        description: "Surrogate key generated from payment_type."
        tests: [unique, not_null]
      - name: payment_type
        description: "Raw payment method label, as recorded by Olist."

  - name: fct_order_items
    description: "One row per ordered item. Central fact table joining order, customer, seller, product, payment, and review information."
    columns:
      - name: order_id
        description: "Identifier of the order this item belongs to."
        tests: [not_null]
      - name: order_item_id
        description: "Sequential number of the item within its order."
      - name: customer_key
        description: "Foreign key to dim_customer."
        tests: [not_null]
      - name: seller_key
        description: "Foreign key to dim_seller."
        tests: [not_null]
      - name: product_key
        description: "Foreign key to dim_product."
      - name: payment_type_key
        description: "Foreign key to dim_payment_type, based on the order's primary payment method."
      - name: order_purchase_date
        description: "Date the order was placed. Used as the partition column for this table."
      - name: delivery_days
        description: "Number of days between purchase and actual delivery to the customer."
      - name: delay_vs_estimate_days
        description: "Difference in days between actual delivery and the estimated delivery date. Positive means late, negative or zero means on time or early."
      - name: price
        description: "Price of the item, excluding freight."
      - name: freight_value
        description: "Shipping cost for this item."
      - name: item_total_value
        description: "Price plus freight for this item."
      - name: order_total_payment_value
        description: "Total amount paid for the entire order, summed across all payment lines."
      - name: order_max_installments
        description: "Highest number of installments used to pay for this order."
      - name: review_score
        description: "Customer review score for the order, from 1 to 5. Same review applies to every item in the order."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 5

  - name: mart_sales_summary
    description: "Daily revenue and order volume. Aggregatable to week, month, or quarter using the corresponding start-date column."
    columns:
      - name: order_purchase_date
        description: "Calendar day the order was placed. Grain of this table."
        tests: [not_null]

      - name: week_start
        description: "First day of the week containing order_purchase_date. Used to roll up daily figures to a weekly view."

      - name: month_start
        description: "First day of the month containing order_purchase_date. Used to roll up daily figures to a monthly view."

      - name: quarter_start
        description: "First day of the quarter containing order_purchase_date. Used to roll up daily figures to a quarterly view."

      - name: nb_orders
        description: "Number of distinct orders placed on this day."

      - name: nb_items
        description: "Total number of ordered items (line items) on this day. Can exceed nb_orders since one order may contain several items."

      - name: revenue
        description: "Total revenue for the day, including item price and freight."
        tests: [not_null]

      - name: revenue_excl_freight
        description: "Total revenue for the day, item price only, excluding freight."

      - name: freight_revenue
        description: "Total freight (shipping) revenue collected on this day."

      - name: avg_order_value
        description: "Average order value for the day, calculated as total revenue divided by the number of distinct orders."

  - name: mart_seller_performance
    description: "Delivery reliability, sales volume, and customer satisfaction per seller, by month."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - month_start
            - seller_id
    columns:
      - name: seller_id
        description: "Unique identifier for the seller. Combined with month_start, forms the grain of this table."
        tests: [not_null]

      - name: seller_state
        description: "Brazilian state where the seller is located (two-letter code)."

      - name: seller_city
        description: "City where the seller is located."

      - name: nb_orders
        description: "Number of distinct orders that included at least one item from this seller."

      - name: nb_items_sold
        description: "Total number of items sold by this seller, across all orders."

      - name: total_revenue
        description: "Total revenue generated by this seller, including item price and freight."

      - name: avg_delivery_days
        description: "Average number of days between purchase and actual delivery, for this seller's items."

      - name: avg_delay_vs_estimate
        description: "Average difference in days between actual delivery and the estimated delivery date. Negative means delivered ahead of schedule, positive means delivered late."

      - name: pct_late_deliveries
        description: "Share of this seller's items delivered after the estimated delivery date, expressed as a percentage."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100

      - name: avg_review_score
        description: "Average customer review score (1 to 5) for orders including this seller's items."
        
      - name: month_start
        description: "First day of the month of purchase. Enables tracking seller reliability trends over time; can be aggregated further in the BI layer."
      
  - name: mart_payment_analysis
    description: "Order volume and revenue broken down by payment method, at the order grain."
    columns:
      - name: payment_type
        description: "Payment method used (credit card, boleto, voucher, etc.)."
        tests: [not_null]
      - name: nb_orders
        description: "Number of orders paid with this method."
        tests: [not_null]
      - name: avg_installments
        description: "Average number of installments chosen for orders paid with this method."
      - name: month_start
        description: "First day of the month containing the order purchase date. Enables trend analysis over time; can be further aggregated to quarter or year in the BI layer."

  - name: mart_product_category_performance
    description: "Sales volume, revenue, and customer satisfaction by product category."
    columns:
      - name: product_category
        description: "Product category, translated to English. 'unknown' when the category could not be matched."
        tests: [not_null]
      - name: nb_items_sold
        description: "Total number of items sold in this category."
      - name: revenue
        description: "Total revenue generated by this category, including freight."
      - name: avg_review_score
        description: "Average customer review score for orders including items from this category."
      - name: month_start
        description: "First day of the month containing the order purchase date. Enables trend analysis over time; can be further aggregated to quarter or year in the BI layer."

  - name: mart_customer_value
    description: "Lifetime value and purchase behavior per unique customer."
    columns:
      - name: customer_unique_id
        description: "Stable customer identifier. Grain of this table."
        tests: [unique, not_null]
      - name: lifetime_value
        description: "Total amount spent by this customer across all orders."
        tests: [not_null]
      - name: is_repeat_customer
        description: "True if the customer has placed more than one order. Given the near 1:1 customer-to-order ratio on this dataset, expect this to be true for a small minority of rows."
      - name: acquisition_month
        description: "First day of the month of the customer's first purchase. Enables cohort-style analysis of customer value by acquisition period."